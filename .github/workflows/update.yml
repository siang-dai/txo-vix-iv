name: Update latest TXO term structure

on:
  workflow_dispatch:
  schedule:
    # 11:27 UTC = 19:27 Asia/Taipei. Weekdays only.
    - cron: "27 11 * * 1-5"

permissions:
  contents: write

concurrency:
  group: txo-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Fetch latest data and draw chart
        env:
          RISK_FREE_RATE: "0.01"
        run: python src/update_latest.py

      - name: Commit changed data and output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vix_term_structure_history.csv output/latest_term_structure.png output/latest_term_structure.svg output/latest.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: update TXO term structure"
            git push
          fi
